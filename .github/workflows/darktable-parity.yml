name: Darktable Parity

on:
  push:
    branches:
      - main
      - stabilisation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  parity:
    name: Darktable 5.6 parity & export verification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run Darktable parity & export hardening fixture suite
        run: cargo test --test darktable_parity --locked -- --nocapture

      - name: Run Darktable XMP codec & escaping unit tests
        run: cargo test darktable::xmp::tests:: --locked -- --nocapture
